title: Endpoint Explorer
version: "0.1.7"
spec-version: v1.3 # the dimos.yaml spec version this file follows
# every dimos.yaml Desktop serves: its own, and each app's (declared endpoints, uses) with the registry's descriptions
uses:
    "@desktop-gateway":
        - GET /api/desktop/dimos.yaml
        - GET /api/apps
        - GET /api/apps/{pkg}/dimos-yaml-check
        - GET /api/endpoints
caches:
    - url: "https://dimos-desktop.cachix.org"
      key: "dimos-desktop.cachix.org-1:A4P35aGJGmCan92LWyamtSFXMqaVE+VRFYnrJ8QMTeQ="
provides:
    openapi: 3.1.0
    info:
        title: Endpoint Explorer
        version: 1.0.0
        description: >-
            Endpoint Explorer: each component's dimos.yaml (Desktop, the dimos gateway, every app): the endpoints it provides,
            the ones it uses, and who uses each
    paths: {}
# prebuilt cross builds Desktop downloads (if a cache above has them) before building dimosApp, per machine type
nix:
    cache:
        aarch64-linux:
            - packages.aarch64-darwin.dimosApp-aarch64-linux
            - packages.x86_64-linux.dimosApp-aarch64-linux
        x86_64-linux:
            - packages.aarch64-darwin.dimosApp-x86_64-linux
